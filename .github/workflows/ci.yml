name: CI

on:
  push:
    branches: [ "**" ]

  pull_request:
    branches: [ "**" ]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (deterministic demo mode – no AI keys needed)
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build