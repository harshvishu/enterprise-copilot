# Default OpenAI LIVE profile. Supply credentials through the environment.

spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

copilot:
  ai:
    mode: LIVE