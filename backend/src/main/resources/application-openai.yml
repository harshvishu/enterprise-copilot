# Default OpenAI LIVE profile. The key is read per run from OPENAI_API_KEY or the project .env.

spring:
  config:
    activate:
      on-profile: openai

copilot:
  ai:
    mode: LIVE
  demo:
    # Provider latency already paces LIVE runs.
    step-delay-ms: ${COPILOT_STEP_DELAY_MS:250}
    activity-delay-ms: ${COPILOT_ACTIVITY_DELAY_MS:250}
