spring:
  application:
    name: enterprise-copilot
  profiles:
    active: demo
  datasource:
    url: jdbc:h2:mem:copilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

copilot:
  ai:
    mode: DEMO          # DEMO | LIVE – surfaced in the UI banner
  demo:
    scenario: NORMAL   # NORMAL | SECURITY_FAILURE | AMBIGUOUS_REQUIREMENT | TEST_FAILURE | MISSING_APPROVAL | HALLUCINATED_API | PROMPT_INJECTION
  github:
    mode: MOCK         # MOCK | REAL

logging:
  level:
    com.enterprise.copilot: INFO
