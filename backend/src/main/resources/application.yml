spring:
  application:
    name: enterprise-copilot
  profiles:
    default: openai
  datasource:
    url: jdbc:h2:mem:copilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # The OpenAI chat model is built on demand so LIVE can be enabled without a restart.
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

copilot:
  ai:
    mode: DEMO # Legacy property; effective mode/banner is derived from the selected profile.
    # LIVE failures are retried; fallback=demo then finishes the run with visible DEMO output.
    fallback: ${COPILOT_AI_FALLBACK:none} # none | demo
    retry-attempts: ${COPILOT_AI_RETRY_ATTEMPTS:2}
    retry-backoff-ms: ${COPILOT_AI_RETRY_BACKOFF_MS:1000}
  demo:
    scenario: NORMAL # NORMAL | SECURITY_FAILURE | AMBIGUOUS_REQUIREMENT | TEST_FAILURE | MISSING_APPROVAL | HALLUCINATED_API | PROMPT_INJECTION
    # Presentation pacing for workshops; set both to 0 to disable.
    step-delay-ms: ${COPILOT_STEP_DELAY_MS:400}
    activity-delay-ms: ${COPILOT_ACTIVITY_DELAY_MS:700}
  github:
    mode: MOCK # MOCK | REAL

logging:
  level:
    com.enterprise.copilot: INFO
