# Ollama LIVE profile - local, key-free. Requires Ollama running with the model pulled.
#   ollama pull llama3.1 && ollama serve
# Run: .\mvnw spring-boot:run "-Dspring-boot.run.profiles=ollama"

spring:
  config:
    activate:
      on-profile: ollama

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1}

copilot:
  ai:
    mode: LIVE
  demo:
    # Provider latency already paces LIVE runs.
    step-delay-ms: ${COPILOT_STEP_DELAY_MS:250}
    activity-delay-ms: ${COPILOT_ACTIVITY_DELAY_MS:250}