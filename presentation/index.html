<!doctype html>
<html lang="en" class="presenter-theme">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Your Sprint Has Agents Now — a Spring AI workshop presentation." />
        <title>Your Sprint Has Agents Now · Spring AI Workshop</title>
        <script>
            (function () {
                var theme = 'system';
                try { theme = localStorage.getItem('copilot-presentation-theme') || 'system'; } catch (e) {}
                var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.add(dark ? 'dark' : 'light');
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/presentation/main.jsx"></script>
    </body>
</html>
